<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Search</title>
</head>
<body>
<h1 id="info"></h1>
<div id="root"></div>
<button id="loadMoreBtn">Load More</button>

<script>
/*
Given an API returning a list of todos, we want to display the list in a performant way.

Here are the functional requirements:
- Initially, display the first 20 todos. 
- On the top of the page, display the total number of loaded todos.
- Display a "Load More" button, and every time the user clicks on it, fetch and display 20 more todos.
- When the total number of loaded todos reaches 100, the "Load More" button should be hidden.

Use this endpoint URL to get the todos: https://dummyjson.com/todos?limit=20&skip=0.

You may change the skip and limit query params to load new todos.
The endpoint will return the following structure with a total of 20 todos:
{
  "todos": [
    {
      "id": 1,
      "todo": "Do something nice for someone I care about",
      "completed": true,
      "userId": 26
    },
  ],
}
*/

const root = document.getElementById("root");
const info = document.getElementById("info");
const loadMoreBtn = document.getElementById("loadMoreBtn");

let limit = 20;
let skip = 0;
let visible = 0;
const maxTodo = 100;

const getTodoData = async () => {
  try {
    const res = await fetch(`https://dummyjson.com/todos?limit=${limit}&skip=${skip}`);
    const data = await res.json();
    const todosData = data.todos || [];
    renderTodo(todosData);
    // update counters
    skip += limit;
  } 
  catch(err) {
    console.log(err);
  }
};

const renderTodo = (todos) => {
  todos.forEach((t, index) => {
    // root.innerHTML += `<p>${visible + index +1} ${t.todo}</p>`;
    const div = document.createElement("div");
    div.textContent = t.todo;
    root.appendChild(div);
  });

  //display todo count 
  visible += todos.length;
  info.textContent = `Loaded Todos: ${visible}`;

  // hide button after 100
  if (visible >= maxTodo) {
    loadMoreBtn.style.display = "none";
  }
};

getTodoData();

loadMoreBtn.addEventListener("click", getTodoData);

</script>

</body>
</html>
