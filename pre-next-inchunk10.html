<!DOCTYPE html>
<html>
<head>
  <title>Js Example</title>
</head>

<body>
  <div id="wrapper"></div>
  <h3 id="info"></h3>
  <button id="pre">pre</button>
  <button id="next">Next</button>

<script>
const container = document.getElementById("wrapper");
const info = document.getElementById("info");
const pre = document.getElementById("pre");
const next = document.getElementById("next");
let nextLoad = 10;
let mexLength = 60;
let skip = 0;

const getData = async ()=>{
  try{
    const res = await fetch(`https://jsonplaceholder.typicode.com/todos?_limit=${nextLoad}&_start=${skip}`);
    const data = await res.json();
    render(data);
    // console.log(data)
  }
  catch(err){
    console.log(err.message);
  }
}

const render = (items)=>{
  container.innerHTML = "";

  items.forEach(t =>{
    const p = document.createElement("p");
    p.textContent = `Id-${t.id}: ${t.title}`;
    container.appendChild(p);
  })

  let itemcount = skip + items.length;
  info.textContent = `${skip} to ${itemcount}`;

  pre.disabled = skip === 0;
  next.disabled = itemcount >= mexLength;
}

pre.addEventListener("click", ()=> {
  skip -= nextLoad;
  getData()
});

next.addEventListener("click", ()=> {
  skip += nextLoad;
  getData()
});

getData();

</script>
</body>
</html>
