<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Search</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, select { margin: 5px; padding: 8px; }
    .product { border: 1px solid #ddd; padding:0 10px; margin-bottom: 10px; }
  </style>
</head>
<body>
<input type="text" id="query" placeholder="Search query" />
<input type="text" id="category" placeholder="Category" />
<input type="text" id="model" placeholder="Brand/Model" />
<input type="text" id="title" placeholder="Title" />
<!-- <button onclick="searchProducts()">Search</button> -->
<button id="btn">Search</button>

<h3>Results:</h3>
<div id="results"></div>

<script>
const btn = document.getElementById("btn");
const resultsDiv = document.getElementById("results");

// async function searchProducts() {
const searchProducts = async () =>{
  const query = document.getElementById("query").value;
  const category = document.getElementById("category").value;
  const model = document.getElementById("model").value;
  const title = document.getElementById("title").value;

  resultsDiv.innerHTML = "Loading...";

  // const url = `https://dummyjson.com/products/search?limit=125&q=${encodeURIComponent(query)}`;

  try {
    const response = await fetch(`https://dummyjson.com/products/search?limit=125&q=${query}`);

    if (!response.ok) {
      throw new Error("API Error: " + response.status);
    }

    const data = await response.json();
    let products = data.products || [];

    // Filters
    if (category) {
      products = products.filter(p =>
        // p.category?.toLowerCase() === category.toLowerCase()
        p.category?.toLowerCase().includes(category.toLowerCase())
      );
    }
    if (model) {
      products = products.filter(p =>
        p.brand?.toLowerCase().includes(model.toLowerCase())
      );
    }
    if (title) {
      products = products.filter(p =>
        p.title?.toLowerCase().includes(title.toLowerCase())
      );
    }

    displayProduct(products);

  } 
  catch (error) {
    console.error(error);
    resultsDiv.innerHTML = "<p style='color:red;'>Failed to load products.</p>";
  }
}

const displayProduct = (products)=>{
  resultsDiv.innerHTML = "";

  if (products.length === 0) {
    resultsDiv.innerHTML = "<p>No products found.</p>";
    return;
  }
  
  products.forEach(p => {
    const div = document.createElement("div");
    div.className = "product";
    const h3 = document.createElement("h3");
    const p1 = document.createElement("p");
    const p2 = document.createElement("p");
    const p3 = document.createElement("p");

    h3.textContent = p.title;
    p1.textContent = p.brand;
    p2.textContent = p.category;
    p3.textContent = p.price;
    
    div.append(h3, p1, p2, p3);
    resultsDiv.appendChild(div);
  });

}


btn.addEventListener("click", searchProducts)

</script>

</body>
</html>
